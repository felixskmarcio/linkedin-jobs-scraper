  <rect x="150" y="226" width="100" height="18" rx="9" fill="#F4F7FA" opacity="0.5"/>
  <rect x="150" y="258" width="64" height="18" rx="9" fill="#F4F7FA" opacity="0.5"/>
  <circle cx="282" cy="267" r="15" fill="#17C3A2"/>

  <!-- handle: white with a green tip -->
